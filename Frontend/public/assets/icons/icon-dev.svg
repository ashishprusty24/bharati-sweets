<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Center Logo Emblem: Laddu / Sweet & Crown -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- Plate / Glow -->
    <ellipse cx="0" cy="50" rx="90" ry="22" fill="#10b981" opacity="0.2"/>
    <!-- Sweets Bowl / Traditional Motichoor -->
    <circle cx="0" cy="0" r="75" fill="#f59e0b"/>
    <circle cx="-25" cy="-15" r="35" fill="#fbbf24"/>
    <circle cx="25" cy="-15" r="35" fill="#d97706"/>
    <circle cx="0" cy="-35" r="30" fill="#fef3c7"/>
    <!-- Garnish (Pista / Saffron) -->
    <ellipse cx="0" cy="-35" rx="6" ry="12" fill="#059669" transform="rotate(30, 0, -35)"/>
    <circle cx="-20" cy="-10" r="4" fill="#059669"/>
    <circle cx="20" cy="-10" r="4" fill="#ef4444"/>
    <!-- Brand Text initials -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">BHARATI SWEETS</text>
  </g>

  <!-- DEV Environment Banner Badge -->
  <g transform="translate(256, 425)" filter="url(#shadow)">
    <rect x="-130" y="-36" width="260" height="72" rx="24" fill="url(#badge)"/>
    <circle cx="-85" cy="0" r="10" fill="#ffffff"/>
    <text x="15" y="13" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">DEV</text>
  </g>
</svg>
