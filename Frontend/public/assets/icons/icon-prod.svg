<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-prod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow-prod" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg-prod)"/>

  <!-- Inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#14b8a6" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Center Logo Emblem -->
  <g transform="translate(256, 240)" filter="url(#shadow-prod)">
    <!-- Glow -->
    <ellipse cx="0" cy="70" rx="100" ry="26" fill="#14b8a6" opacity="0.3"/>
    <!-- Sweets Bowl / Traditional Motichoor -->
    <circle cx="0" cy="0" r="95" fill="#f59e0b"/>
    <circle cx="-32" cy="-20" r="45" fill="#fbbf24"/>
    <circle cx="32" cy="-20" r="45" fill="#d97706"/>
    <circle cx="0" cy="-45" r="40" fill="#fef3c7"/>
    <!-- Garnish -->
    <ellipse cx="0" cy="-45" rx="8" ry="16" fill="#059669" transform="rotate(30, 0, -45)"/>
    <circle cx="-25" cy="-12" r="5" fill="#059669"/>
    <circle cx="25" cy="-12" r="5" fill="#ef4444"/>
    <!-- Brand Text initials -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">BHARATI SWEETS</text>
  </g>
</svg>
